# jira: BA-XXX
# uat: SUB — Parent Confirm Session End
# NOTE: Sub-flow for cross-app orchestration. NOT standalone.
appId: polygentic.bijouxParentApp
tags:
  - sub-flow
---
# Wait for session end confirmation prompt
- assertVisible:
    text: "Session Complete"
    timeout: 30000
    optional: true
- assertVisible:
    text: "Rate"
    timeout: 15000
    optional: true
# Rate the session if prompted
- tapOn:
    text: "5"
    optional: true
- tapOn:
    text: "Submit"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/parent-session-ended
