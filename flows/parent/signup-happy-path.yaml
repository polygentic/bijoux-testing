# jira: BA-106
# uat: UAT-3.1 Signup Happy Path
# NOTE: The signup account parent-new@test.bijoux.app must be deleted between runs.
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- assertVisible: "Welcome Back"

# Tap Sign Up link using accessibility ID
- tapOn:
    id: "login-signup-link"

- waitForAnimationToEnd

- assertVisible: "Create Account"

# Step 1: Name — tap placeholder text to focus fields
- tapOn: "Enter your first name"
- inputText: "Test"

- tapOn: "Enter your last name"
- inputText: "Parent"

- tapOn: "Continue"

- waitForAnimationToEnd

# Step 2: Email
- tapOn: "you@example.com"
- inputText: "parent-new@test.bijoux.app"

- tapOn: "Continue"

- waitForAnimationToEnd

# Step 3: Password
- tapOn: "Create a password"
- inputText: "Test1234!"

- tapOn: "Re-enter your password"
- inputText: "Test1234!"


- tapOn:
    id: "signup-continue-button"

- waitForAnimationToEnd

# Should navigate to OTP verification screen
- assertVisible: ".*verif.*|.*OTP.*|.*code.*|.*confirm.*"

- takeScreenshot: signup-verification-screen
