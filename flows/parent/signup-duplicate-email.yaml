# jira: BA-107
# uat: UAT-3.2 Signup Duplicate Email
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- assertVisible: "Welcome Back"

# Tap Sign Up link
- tapOn:
    id: "login-signup-link"

- waitForAnimationToEnd

- assertVisible: "Create Account"

# Step 1: Name — tap placeholder text to focus fields
- tapOn: "Enter your first name"
- inputText: "Test"

- tapOn: "Enter your last name"
- inputText: "Parent"

- tapOn: "Continue"

- waitForAnimationToEnd

# Step 2: Email — use an existing account
- tapOn: "you@example.com"
- inputText: "parent-sarah@test.bijoux.app"

- tapOn: "Continue"

- waitForAnimationToEnd

# Step 3: Password
- tapOn: "Create a password"
- inputText: "Test1234!"

- tapOn: "Re-enter your password"
- inputText: "Test1234!"

- scroll

- tapOn:
    id: "signup-continue-button"

- waitForAnimationToEnd

# Should show duplicate/error message
- assertVisible: ".*already.*|.*exists.*|.*duplicate.*|.*registered.*|.*error.*"

- takeScreenshot: signup-duplicate-email-error
