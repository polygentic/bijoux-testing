# jira: BA-299
# uat: UAT-20.1 — Proximity Happy Path (Parent)
# Scenario: Both sims NEAR, PROXIMITY_CHECK_ENABLED=true, full lifecycle.
# Pre: orchestrator runs sim_set_location NEAR + sim_grant_location before/after launch.
# Mirrors parent/login-book-session-end.yaml; the proximity-waiting-label wait is a
# defensive notVisible check (clears once both parties' proximity resolves).
appId: polygentic.bijouxParentApp
tags:
  - cross-app
  - proximity
---
# ═══ LOGIN ═══
- launchApp:
    clearState: true
    clearKeychain: true
- waitForAnimationToEnd
# Dismiss any OS location-permission dialog (fallback if sim_grant_location didn't pre-grant)
- tapOn:
    text: "Allow While Using App"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "onboarding-get-started-button"
- waitForAnimationToEnd
- tapOn: "you@example.com"
- inputText: "parent-sarah@test.bijoux.app"
- tapOn: "Welcome Back"
- tapOn: "Enter your password"
- inputText: "Test1234!"
- tapOn: "Welcome Back"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
# iOS may surface a "Save Password?" system sheet after a credential submit. It
# overlays the booking form (covering the Duration selector and pushing
# quick-booking-submit-button below the fold), so dismiss it before booking.
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting-label"
- takeScreenshot: results/cross-app/proximity-p-logged-in

# ═══ CREATE BOOKING ═══
- tapOn:
    id: "home-request-now-card"
    optional: true
- tapOn:
    text: "Request Now"
    optional: true
- waitForAnimationToEnd
# Re-dismiss the Save Password sheet if it (re)appears over the booking form.
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Duration"
    optional: true
- tapOn:
    text: ".*Lily.*|.*Max.*"
    optional: true
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: "quick-booking-submit-button"
- waitForAnimationToEnd
- tapOn:
    text: "Capture"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "quick-booking-submit-button"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/proximity-p-matching-started

# ═══ WAIT FOR CAREGIVER ARRIVAL (app polls automatically) ═══
- extendedWaitUntil:
    visible: ".*Caregiver Has Arrived.*|.*Start Identity Verification.*"
    timeout: 240000
- takeScreenshot: results/cross-app/proximity-p-caregiver-arrived

# ═══ VERIFY START (identity verification — mock Veriff) ═══
- tapOn: "Start Identity Verification"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Capture"
    timeout: 10000
- tapOn: "Capture"
- waitForAnimationToEnd
# If the parent submits proximity first, the app shows proximity-waiting-label while
# polling for the caregiver's submission. Both NEAR → resolves quickly; 60s is generous.
- extendedWaitUntil:
    notVisible:
      id: "proximity-waiting-label"
    timeout: 60000

# ═══ WAIT FOR SESSION ACTIVE (caregiver must also verify) ═══
- extendedWaitUntil:
    visible: ".*In Progress.*|.*End Job.*"
    timeout: 120000
# The active-session-end-button lives on the ActiveSessionView (a separate screen), not on
# the Home card. Reaching it: tap the compact card to EXPAND it (reveals "View Full Session"),
# then tap "View Full Session" to navigate. The old flow only toggled the card and never
# navigated, so the end button was never present. Tap the card's In-Progress row text (a
# reliable hit target on the card's tappable compact row) to expand it.
- tapOn:
    text: ".*In Progress.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "View Full Session"
    timeout: 10000
- tapOn: "View Full Session"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/proximity-p-session-active
- extendedWaitUntil:
    visible:
      id: "active-session-end-button"
    timeout: 30000

# ═══ END JOB ═══
- tapOn:
    id: "active-session-end-button"
- waitForAnimationToEnd
- tapOn:
    id: "end-job-confirm-button"
- waitForAnimationToEnd

# ═══ VERIFY END (identity verification — mock Veriff) ═══
- extendedWaitUntil:
    visible: "Capture"
    timeout: 30000
- tapOn: "Capture"
- waitForAnimationToEnd

# ═══ WAIT FOR SESSION COMPLETE ═══
- extendedWaitUntil:
    visible: ".*Session Complete.*|.*How was your experience.*"
    timeout: 120000
- takeScreenshot: results/cross-app/proximity-p-session-complete

# ═══ RATE ═══
- tapOn:
    id: "summary-rating-label"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "summary-done-button"
- waitForAnimationToEnd
