# jira: BA-300
# uat: UAT-20.2 — Drift → Admin Override → Retry (Parent)
# Scenario: Parent sim at DRIFT (~89m from caregiver). Handoff start proximity FAILS.
#   The orchestrator calls the admin session proximity-override API, then the app re-enables
#   the verify flow (proximity-waiting-label clears).
# Pre: orchestrator runs sim_set_location (parent DRIFT) + sim_grant_location.
appId: polygentic.bijouxParentApp
tags:
  - cross-app
  - proximity
---
# ═══ LOGIN ═══
- launchApp:
    clearState: true
    clearKeychain: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow While Using App"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "onboarding-get-started-button"
- waitForAnimationToEnd
- tapOn: "you@example.com"
- inputText: "parent-sarah@test.bijoux.app"
- tapOn: "Welcome Back"
- tapOn: "Enter your password"
- inputText: "Test1234!"
- tapOn: "Welcome Back"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
# iOS may surface a "Save Password?" system sheet after a credential submit; it
# overlays the booking form, so dismiss it before booking.
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting-label"

# ═══ CREATE BOOKING ═══
- tapOn:
    id: "home-request-now-card"
    optional: true
- tapOn:
    text: "Request Now"
    optional: true
- waitForAnimationToEnd
# Re-dismiss the Save Password sheet if it (re)appears over the booking form.
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Duration"
    optional: true
- tapOn:
    text: ".*Lily.*|.*Max.*"
    optional: true
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: "quick-booking-submit-button"
- waitForAnimationToEnd
- tapOn:
    text: "Capture"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "quick-booking-submit-button"
    optional: true
- waitForAnimationToEnd

# ═══ WAIT FOR CAREGIVER ARRIVAL ═══
- extendedWaitUntil:
    visible: ".*Caregiver Has Arrived.*|.*Start Identity Verification.*"
    timeout: 240000
- takeScreenshot: results/cross-app/proximity-p-drift-caregiver-arrived

# ═══ VERIFY START — proximity FAILS (parent at DRIFT) ═══
# App behaviour: at DRIFT (>50 m handoff threshold) the parent's proximity gate first shows the
# "Waiting for the other person…" overlay (proximity-waiting-label) while the caregiver hasn't
# submitted; once both parties submit, the backend returns proximityFailed (too far) and the
# parent STOPS polling, showing a "move closer … Retry" error on the verification cover. The
# admin override (sent by the orchestrator) clears the gate SERVER-SIDE but the parent app has
# stopped polling — so the parent must tap Retry (the capture button relabelled "Retry") to
# re-submit; the now-overridden gate returns passed and the session proceeds.
- tapOn: "Start Identity Verification"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Capture"
    timeout: 10000
- tapOn: "Capture"
- waitForAnimationToEnd
# Observe the DRIFT fail/wait state (either the waiting overlay or the move-closer Retry error).
- extendedWaitUntil:
    visible:
      text: ".*Waiting for the other.*|.*move closer.*|.*apart.*|.*Retry.*"
    timeout: 60000
- takeScreenshot: results/cross-app/proximity-p-drift-fail
# The orchestrator admin-overrides the start gate concurrently. Race between the override landing
# and our retry, so retry the capture/Retry button REPEATEDLY until the session goes active. Each
# retry re-submits proximity; the first retry after the override returns passed and starts it.
- repeat:
    times: 20
    while:
      notVisible: ".*In Progress.*|.*End Job.*"
    commands:
      - tapOn:
          id: "verification-capture-button"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: ".*In Progress.*|.*End Job.*"
          timeout: 6000

# ═══ SESSION ACTIVE (after override + retry clears the block) ═══
- extendedWaitUntil:
    visible: ".*In Progress.*|.*End Job.*"
    timeout: 120000
# Reach the ActiveSessionView (end button lives there, not on the Home card): expand the
# In-Progress card, then tap "View Full Session".
- tapOn:
    text: ".*In Progress.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "View Full Session"
    timeout: 10000
- tapOn: "View Full Session"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/proximity-p-drift-session-active
- extendedWaitUntil:
    visible:
      id: "active-session-end-button"
    timeout: 30000

# ═══ END JOB ═══
- tapOn:
    id: "active-session-end-button"
- waitForAnimationToEnd
- tapOn:
    id: "end-job-confirm-button"
- waitForAnimationToEnd

# ═══ VERIFY END ═══
- extendedWaitUntil:
    visible: "Capture"
    timeout: 30000
- tapOn: "Capture"
- waitForAnimationToEnd

# ═══ SESSION COMPLETE ═══
- extendedWaitUntil:
    visible: ".*Session Complete.*|.*How was your experience.*"
    timeout: 120000
- takeScreenshot: results/cross-app/proximity-p-drift-session-complete
- tapOn:
    id: "summary-rating-label"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "summary-done-button"
- waitForAnimationToEnd
