# uat: SUB — Parent Confirm Session Start
# NOTE: Sub-flow. Parent must have an active booking with caregiver arrived.
#       Veriff verification is mocked/stubbed.
appId: polygentic.bijouxParentApp
---
# Wait for session start verification prompt
- extendedWaitUntil:
    visible: "Verify"
    timeout: 30000
  optional: true
- tapOn: "Verify"
  optional: true
- tapOn: "Verify Identity"
  optional: true
- waitForAnimationToEnd
# Mocked Veriff auto-completes
- takeScreenshot: results/cross-app/parent-session-start-confirmed
