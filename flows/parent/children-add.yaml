# jira: BA-119
# uat: UAT-7.5 Add Child Form
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- tapOn:
    text: "you@example.com"

- inputText: "parent-sarah@test.bijoux.app"

- tapOn: "Welcome Back"

- tapOn: "Enter your password"

- inputText: "Test1234!"

- tapOn: "Welcome Back"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- tapOn: "Profile"

- waitForAnimationToEnd

- tapOn: ".*Children.*|.*My Children.*"

- waitForAnimationToEnd

# Verify the My Children screen loaded
- assertVisible: ".*My Children.*"

# NOTE: Known app bug — ChildrenListView shows "No Children" despite
# children existing in backend (they load correctly on the booking form).
# The "Add Child" button is present in the empty state, so tap it.
- tapOn: "Add Child"

- waitForAnimationToEnd

# Verify add child form loaded
- assertVisible: ".*First Name.*|.*name.*|.*Name.*"

- takeScreenshot: add-child-form
