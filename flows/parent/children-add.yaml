# jira: BA-119
# uat: UAT-7.5 Add Child Form
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- tapOn:
    text: "you@example.com"

- inputText: "parent-sarah@test.bijoux.app"

- tapOn: "Welcome Back"

- tapOn: "Enter your password"

- inputText: "Test1234!"

- tapOn: "Welcome Back"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- tapOn: "Profile"

- waitForAnimationToEnd

- tapOn: ".*Children.*|.*My Children.*"

- waitForAnimationToEnd

- tapOn: ".*Add.*|.*\\+.*"

- waitForAnimationToEnd

- assertVisible: ".*name.*|.*Name.*"

- assertVisible: ".*DOB.*|.*Date of Birth.*|.*Birthday.*|.*birth.*"

- assertVisible: ".*gender.*|.*Gender.*"

- takeScreenshot: add-child-form
