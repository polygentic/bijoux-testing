# jira: BA-120
# uat: UAT-7.6 Change Password Form
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- tapOn:
    text: "you@example.com"

- inputText: "parent-sarah@test.bijoux.app"

- tapOn: "Welcome Back"

- tapOn: "Enter your password"

- inputText: "Test1234!"

- tapOn: "Welcome Back"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- tapOn: "Profile"

- waitForAnimationToEnd


- tapOn: ".*Change Password.*"

- waitForAnimationToEnd

- assertVisible: ".*current.*password.*|.*Current.*Password.*|.*Old.*Password.*"

- assertVisible: ".*new.*password.*|.*New.*Password.*"

- assertVisible: ".*confirm.*password.*|.*Confirm.*Password.*"

- takeScreenshot: change-password-form
