# jira: BA-111
# uat: UAT-5.1 Quick Booking Form
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- tapOn:
    text: "you@example.com"

- inputText: "parent-sarah@test.bijoux.app"

- tapOn: "Welcome Back"

- tapOn: "Enter your password"

- inputText: "Test1234!"

- tapOn: "Welcome Back"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- assertVisible: "Request Now"

- tapOn:
    id: "home-request-now-card"

- waitForAnimationToEnd

- takeScreenshot: quick-booking-form-top

- assertVisible: ".*address.*|.*Address.*|.*location.*|.*Location.*"

- scroll

- assertVisible: ".*Request Caregiver.*|.*Submit.*|.*Book.*"

- takeScreenshot: quick-booking-form-scrolled
