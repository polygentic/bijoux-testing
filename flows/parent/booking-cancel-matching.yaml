# jira: BA-113
# uat: UAT-5.3 Cancel Booking During Matching
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- tapOn:
    text: "you@example.com"

- inputText: "parent-sarah@test.bijoux.app"

- tapOn: "Welcome Back"

- tapOn: "Enter your password"

- inputText: "Test1234!"

- tapOn: "Welcome Back"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- tapOn:
    id: "home-request-now-card"

- waitForAnimationToEnd

# Select a child (required for booking)
- tapOn: ".*Lily.*"

- scroll

# Submit booking request — first tap triggers IDV re-verification
- tapOn: "Request Caregiver"

- waitForAnimationToEnd

# Complete biometric re-verification (mock — just tap Capture)
- tapOn: "Capture"

- waitForAnimationToEnd

# Re-submit after re-verification completes
- scroll

- tapOn: "Request Caregiver"

- waitForAnimationToEnd

# Wait for matching state to appear
- waitForAnimationToEnd

# Should transition to searching/matching state
- assertVisible: ".*earch.*|.*atch.*|.*finding.*|.*looking.*|.*Searching.*|.*Finding.*"

- takeScreenshot: matching-in-progress

# Cancel the matching
- tapOn: ".*Cancel.*|.*cancel.*"

- waitForAnimationToEnd

# Dismiss the "Search Canceled" confirmation
- tapOn: "Dismiss"

- waitForAnimationToEnd

# Should return to home
- assertVisible: "Request Now"

- takeScreenshot: returned-to-home-after-cancel
