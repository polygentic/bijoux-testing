# Combined: Login → Book → Wait for Arrival → Verify Start → Active Session → End → Rate → Done
# Full parent lifecycle in a single Maestro process (prevents XCTest driver restart state loss).
# Runs CONCURRENTLY with caregiver/login-online-accept-session-end.yaml on the caregiver simulator.
appId: polygentic.bijouxParentApp
tags:
  - cross-app
  - session-lifecycle
---
# ═══ LOGIN ═══
- launchApp:
    clearState: true
    clearKeychain: true
- waitForAnimationToEnd
- tapOn:
    id: "onboarding-get-started-button"
- waitForAnimationToEnd
- tapOn: "you@example.com"
- inputText: "parent-sarah@test.bijoux.app"
- tapOn: "Welcome Back"
- tapOn: "Enter your password"
- inputText: "Test1234!"
- tapOn: "Welcome Back"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting-label"
- takeScreenshot: results/cross-app/parent-logged-in

# ═══ CREATE BOOKING ═══
- tapOn:
    id: "home-request-now-card"
    optional: true
- tapOn:
    text: "Request Now"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Duration"
    optional: true
- tapOn:
    text: ".*Lily.*|.*Max.*"
    optional: true
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: "quick-booking-submit-button"
- waitForAnimationToEnd
- tapOn:
    text: "Capture"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "quick-booking-submit-button"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/parent-matching-started

# ═══ WAIT FOR CAREGIVER ARRIVAL (app polls automatically) ═══
- extendedWaitUntil:
    visible: ".*Caregiver Has Arrived.*|.*Start Identity Verification.*"
    timeout: 240000
- takeScreenshot: results/cross-app/parent-caregiver-arrived

# ═══ VERIFY START (identity verification — mock Veriff) ═══
- tapOn: "Start Identity Verification"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Capture"
    timeout: 10000
- tapOn: "Capture"
- waitForAnimationToEnd

# ═══ WAIT FOR SESSION ACTIVE (caregiver must also verify) ═══
# After verification, the app may return to home dashboard with session card.
# Wait for either the active session screen or the home session card.
- extendedWaitUntil:
    visible: ".*In Progress.*|.*End Job.*"
    timeout: 120000
# If on home dashboard, tap the session card to re-enter matching flow
- tapOn:
    id: "home-active-session-card"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/parent-session-active
# Wait for the matching flow's active session view to show End Job
- extendedWaitUntil:
    visible:
      id: "active-session-end-button"
    timeout: 30000

# ═══ END JOB ═══
- tapOn:
    id: "active-session-end-button"
- waitForAnimationToEnd
# Confirm end (custom view, not system alert)
- tapOn:
    id: "end-job-confirm-button"
- waitForAnimationToEnd

# ═══ VERIFY END (identity verification — mock Veriff) ═══
- extendedWaitUntil:
    visible: "Capture"
    timeout: 30000
- tapOn: "Capture"
- waitForAnimationToEnd

# ═══ WAIT FOR SESSION COMPLETE (caregiver must also verify end) ═══
- extendedWaitUntil:
    visible: ".*Session Complete.*|.*How was your experience.*"
    timeout: 120000
- takeScreenshot: results/cross-app/parent-session-complete

# ═══ RATE (tap star area for rating, then Done) ═══
- tapOn:
    id: "summary-rating-label"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "summary-done-button"
- waitForAnimationToEnd
