# jira: BA-XXX
# uat: SUB — Parent Quick Booking Submit
# NOTE: Sub-flow for cross-app orchestration. NOT standalone.
appId: polygentic.bijouxParentApp
tags:
  - sub-flow
---
# Bring app to foreground (preserves login state)
- launchApp
- waitForAnimationToEnd
# From home screen, initiate a quick booking
- tapOn:
    id: "home-request-now-card"
    optional: true
- tapOn:
    text: "Request Now"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/parent-booking-form
# Fill in address if field is empty
- tapOn:
    text: "Enter address"
    optional: true
- inputText: "123 Main St, Austin, TX"
# Select first child (Sarah's children: Lily/Max, James's children: Sofia)
- tapOn:
    text: ".*Lily.*|.*Max.*|.*Sofia.*|.*Age.*"
    optional: true
# Submit booking
- tapOn: "Request Caregiver"
- waitForAnimationToEnd
# Handle stubbed identity verification (if shown)
- tapOn:
    text: "Capture"
    optional: true
- waitForAnimationToEnd
# If verification sent us back to booking form, submit again
- tapOn:
    text: "Request Caregiver"
    optional: true
- waitForAnimationToEnd
# Should transition to matching/searching state
- takeScreenshot: results/cross-app/parent-matching-started
