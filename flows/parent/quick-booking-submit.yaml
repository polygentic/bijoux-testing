# jira: BA-XXX
# uat: SUB — Parent Quick Booking Submit
# NOTE: Sub-flow for cross-app orchestration. NOT standalone.
appId: polygentic.bijouxParentApp
tags:
  - sub-flow
---
# From home screen, initiate a quick booking
- tapOn:
    id: "home-request-now-card"
- waitForAnimationToEnd
- assertVisible: "Request Caregiver"
- takeScreenshot: results/cross-app/parent-booking-form
# Fill in address if field is empty
- tapOn:
    text: "Enter address"
    optional: true
- inputText: "123 Main St, Austin, TX"
- scroll
# Select first child
- tapOn:
    text: ".*Lily.*|.*Max.*"
    optional: true
# Submit booking
- tapOn: "Request Caregiver"
- waitForAnimationToEnd
# Should transition to matching/searching state
- takeScreenshot: results/cross-app/parent-matching-started
