# jira: BA-108
# uat: UAT-3.3 Signup Weak Password
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- assertVisible: "Welcome Back"

- tapOn: ".*Sign Up.*|.*Create Account.*|.*Don't have an account.*"

- waitForAnimationToEnd

- tapOn: "First Name"

- inputText: "Test"

- tapOn: "Last Name"

- inputText: "Parent"

- tapOn:
    text: "you@example.com"
    optional: true

- tapOn:
    text: "Email"
    optional: true

- inputText: "parent-new@test.bijoux.app"

- scroll

- tapOn: ".*password.*"

- inputText: "123"

- scroll

- tapOn:
    id: "signup-submit-button"
    optional: true

- tapOn:
    text: ".*Create Account.*|.*Sign Up.*|.*Submit.*"
    optional: true

- waitForAnimationToEnd

- assertVisible: ".*password.*|.*weak.*|.*strong.*|.*characters.*|.*requirement.*|.*error.*"

- takeScreenshot: signup-weak-password-error
