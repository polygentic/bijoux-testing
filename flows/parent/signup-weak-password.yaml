# jira: BA-108
# uat: UAT-3.3 Signup Weak Password
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- assertVisible: "Welcome Back"

# Tap Sign Up link
- tapOn:
    id: "login-signup-link"

- waitForAnimationToEnd

- assertVisible: "Create Account"

# Step 1: Name — tap placeholder text to focus fields
- tapOn: "Enter your first name"
- inputText: "Test"

- tapOn: "Enter your last name"
- inputText: "Parent"

- tapOn: "Continue"

- waitForAnimationToEnd

# Step 2: Email
- tapOn: "you@example.com"
- inputText: "parent-new@test.bijoux.app"

- tapOn: "Continue"

- waitForAnimationToEnd

# Step 3: Weak password
- tapOn: "Create a password"
- inputText: "123"

- tapOn: "Re-enter your password"
- inputText: "123"


- tapOn:
    id: "signup-continue-button"

- waitForAnimationToEnd

# Should show password weakness error
- assertVisible: ".*password.*|.*weak.*|.*strong.*|.*characters.*|.*requirement.*|.*error.*"

- takeScreenshot: signup-weak-password-error
