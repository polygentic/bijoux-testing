# uat: Parent Login — James Rivera (second parent)
appId: polygentic.bijouxParentApp
tags:
  - cross-app
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn: "Get Started"

- waitForAnimationToEnd

# Wait for login screen to load (second sim can be slow)
- extendedWaitUntil:
    visible: "you@example.com"
    timeout: 30000

- tapOn: "you@example.com"
- inputText: "parent-james@test.bijoux.app"

- tapOn: "Welcome Back"

- tapOn: "Enter your password"
- inputText: "Test1234!"

- tapOn: "Welcome Back"

- tapOn: "Log In"

- waitForAnimationToEnd

# Dismiss iOS "Save Password?" dialog if it appears
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd

- assertVisible: "Home"

- takeScreenshot: results/cross-app/parent-james-logged-in
