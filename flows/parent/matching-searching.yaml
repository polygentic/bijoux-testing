# jira: BA-114
# uat: UAT-6.1 Matching Searching State
appId: polygentic.bijouxParentApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- tapOn:
    text: "you@example.com"

- inputText: "parent-sarah@test.bijoux.app"

- tapOn: "Welcome Back"

- tapOn: "Enter your password"

- inputText: "Test1234!"

- tapOn: "Welcome Back"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- tapOn:
    id: "home-request-now-card"

- waitForAnimationToEnd

- scroll

- tapOn: ".*Request Caregiver.*|.*Submit.*|.*Book.*"

- waitForAnimationToEnd

- assertVisible: ".*earch.*|.*atch.*|.*finding.*|.*looking.*"

- takeScreenshot: matching-searching-state

- tapOn: ".*Cancel.*|.*cancel.*"

- waitForAnimationToEnd
