# jira: BA-205
# uat: UAT-2.5 Login - Valid credentials for fully onboarded caregiver
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

# Dismiss email keyboard
- tapOn: "Welcome Back"

# Toggle password to plain text mode via eye icon
# (Workaround: Maestro XCTest driver cannot input into SwiftUI SecureField on iOS 26.5)
- tapOn: "Show password"

# Tap the now-plain TextField and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Toggle back to secure mode (shifts focus away, dismisses keyboard)
- tapOn: "Hide password"

- waitForAnimationToEnd

# Tap login submit button
- tapOn:
    id: "login-submit-button"

# Wait for login network call + navigation to complete
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000

# Dismiss iOS "Save Password?" dialog if it appears
- tapOn:
    text: "Not Now"
    optional: true

# cg-emma is fully onboarded — verify home screen loaded
- assertVisible: "Home"
- takeScreenshot: results/caregiver-login-success
