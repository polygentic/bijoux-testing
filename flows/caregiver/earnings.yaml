# jira: BA-803
# uat: UAT-8.3 Earnings - Verify earnings screen with totals
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

# Dismiss keyboard
- scroll

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Dismiss keyboard
- scroll

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard
- assertVisible:
    id: "home-greeting-label"

# Navigate to Earnings tab (text-based tap for tab bar)
- tapOn: "Earnings"

- waitForAnimationToEnd

# Verify earnings screen loads with total earned and session count
- assertVisible: ".*Earnings.*|.*Total.*"

# Scroll to verify additional earnings details
- scroll
- assertVisible: ".*session.*|.*earned.*|.*\\$.*"
