# uat: Caregiver Login — Maria Santos (second caregiver)
appId: polygentic.bijouxCaregiverApp
tags:
  - cross-app
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn: "Get Started"

- waitForAnimationToEnd

- tapOn: "you@example.com"
- inputText: "cg-maria@test.bijoux.app"

- scroll

- tapOn: "Welcome Back"

- tapOn: "Enter your password"
- inputText: "Test1234!"

- scroll

- tapOn: "Sign In"

- waitForAnimationToEnd

# Dismiss iOS "Save Password?" dialog if it appears
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd

- assertVisible: "Home"

- takeScreenshot: results/cross-app/caregiver-maria-logged-in
