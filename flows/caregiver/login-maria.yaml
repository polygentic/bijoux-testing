# uat: Caregiver Login — Maria Santos (second caregiver)
appId: polygentic.bijouxCaregiverApp
tags:
  - cross-app
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn: "Get Started"

- waitForAnimationToEnd

- tapOn: "you@example.com"
- inputText: "cg-maria@test.bijoux.app"


- tapOn: "Welcome Back"

# Toggle password to plain text mode via eye icon
# (Workaround: Maestro XCTest driver cannot input into SwiftUI SecureField on iOS 26.5)
- tapOn: "Show password"

# Tap the now-plain TextField and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Toggle back to secure mode
- tapOn: "Hide password"


# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Dismiss iOS "Save Password?" dialog if it appears
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd

- assertVisible: "Home"

- takeScreenshot: results/cross-app/caregiver-maria-logged-in
