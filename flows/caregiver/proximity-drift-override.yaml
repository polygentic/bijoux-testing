# jira: BA-300
# uat: UAT-20.2 — Drift → Admin Override → Retry (Caregiver)
# Scenario: Caregiver sim at NEAR (arrival passes), parent sim at DRIFT (~89m → handoff fails).
#   The caregiver reaches the silent proximity gate and shows proximity-waiting-label; the
#   orchestrator then calls the admin session proximity-override API, which unblocks the gate.
# Pre: orchestrator runs sim_set_location (CG NEAR) + sim_grant_location.
appId: polygentic.bijouxCaregiverApp
tags:
  - cross-app
  - proximity
---
# ═══ LOGIN ═══
- launchApp:
    clearState: true
    clearKeychain: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow While Using App"
    optional: true
- waitForAnimationToEnd
- tapOn: "Get Started"
- waitForAnimationToEnd
- tapOn: "you@example.com"
- inputText: "cg-maria@test.bijoux.app"
- tapOn: "Welcome Back"
- tapOn: "Show password"
- extendedWaitUntil:
    visible:
      id: "login-password-field"
    timeout: 5000
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"
- tapOn: "Hide password"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- assertVisible: "Home"

# ═══ GO ONLINE ═══
- tapOn:
    text: ".*Go Online.*|.*Online.*"
    optional: true
- waitForAnimationToEnd

# ═══ WAIT FOR OFFER + ACCEPT ═══
- extendedWaitUntil:
    visible: "Accept"
    timeout: 180000
- tapOn: "Accept"
- waitForAnimationToEnd

# ═══ IOMW ═══
- extendedWaitUntil:
    visible: "I'm On My Way"
    timeout: 15000
- tapOn: "I'm On My Way"
- waitForAnimationToEnd

# ═══ ARRIVAL (CG at NEAR → arrival passes) ═══
- extendedWaitUntil:
    visible: "I've Arrived"
    timeout: 30000
# Scroll the below-the-fold "I've Arrived" button above the tab bar before tapping, or
# Maestro taps its off-screen coordinates and mis-navigates to Activity (see happy-path).
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- tapOn: "I've Arrived"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/proximity-cg-drift-arrived

# ═══ VERIFY START — handoff proximity BLOCKED (both parties 89 m apart at DRIFT) ═══
# App sequence: tapping arrived-verify-button opens the verification cover; the silent handoff
# proximity gate runs on CAPTURE (completeSessionVerification -> runProximityGate). Both parties
# are ~89 m apart (parent at DRIFT), which exceeds the 50 m handoff threshold, so the backend
# returns proximityFailed — BOTH apps stop polling and show a "You're 90 m apart — move closer"
# error with the capture button relabelled "Retry". The orchestrator admin-overrides the start
# gate SERVER-SIDE, but each app has stopped polling — so each must tap Retry to re-submit; the
# now-overridden gate returns passed and the session goes active.
- extendedWaitUntil:
    visible:
      id: "arrived-verify-button"
    timeout: 30000
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: "arrived-verify-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "verification-capture-button"
    timeout: 30000
- tapOn:
    id: "verification-capture-button"
- waitForAnimationToEnd
# DRIFT fail observed: the move-closer / Retry state (proves the handoff gate blocked the start).
- extendedWaitUntil:
    visible:
      text: ".*apart.*|.*move closer.*|.*Retry.*|.*Waiting for the other.*"
    timeout: 60000
- takeScreenshot: results/cross-app/proximity-cg-drift-waiting
# The orchestrator admin-overrides the start gate concurrently. There is a race between the
# override landing and our retry, so retry the capture/Retry button REPEATEDLY until the session
# goes active (home-active-job-card). Each retry re-submits proximity; the first retry that lands
# after the override returns passed and starts the session. Poll ~every 6s, up to ~2 min.
- repeat:
    times: 20
    while:
      notVisible:
        id: "home-active-job-card"
    commands:
      - tapOn:
          id: "verification-capture-button"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "home-active-job-card"
          timeout: 6000

# ═══ SESSION ACTIVE (the admin override + retry clears the blocked handoff → session starts) ═══
- extendedWaitUntil:
    visible:
      id: "home-active-job-card"
    timeout: 120000
- tapOn:
    id: "home-active-job-card"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/proximity-cg-drift-session-active

# ═══ END JOB ═══
- extendedWaitUntil:
    visible:
      id: "in-progress-end-button"
    timeout: 30000
- tapOn:
    id: "in-progress-end-button"
- waitForAnimationToEnd
- tapOn: "Confirm"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "verification-capture-button"
    timeout: 30000
- tapOn:
    id: "verification-capture-button"
- waitForAnimationToEnd

# ═══ SESSION COMPLETE ═══
- extendedWaitUntil:
    visible: ".*Session Complete.*|.*Take Home.*|.*Well done.*"
    timeout: 120000
- takeScreenshot: results/cross-app/proximity-cg-drift-session-complete
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: ".*Take Home.*|.*Dismiss.*"
    optional: true
- waitForAnimationToEnd
