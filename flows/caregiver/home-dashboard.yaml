# jira: BA-403
# uat: UAT-4.3 Home Dashboard - Verify greeting and status indicator
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

# Dismiss keyboard

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Toggle back to secure mode
- tapOn: "Hide password"

# Dismiss keyboard

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard loaded
- assertVisible: "Home"

# Emma has an active session — verify active session state is shown
- assertVisible: ".*Arrived.*|.*Active.*|.*Session.*"

- takeScreenshot: caregiver-home-dashboard
