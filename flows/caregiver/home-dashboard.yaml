# jira: BA-403
# uat: UAT-4.3 Home Dashboard - Verify greeting and status indicator
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

# Dismiss keyboard
- scroll

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Dismiss keyboard
- scroll

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard shows greeting
- assertVisible:
    id: "home-greeting-label"

# Verify online/offline toggle or status indicator is visible
- scroll
- assertVisible: ".*online.*|.*offline.*|.*status.*|.*Go Online.*"
