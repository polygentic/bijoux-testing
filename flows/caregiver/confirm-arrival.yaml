# jira: BA-XXX
# uat: SUB — Caregiver Confirm Arrival
# NOTE: Sub-flow. Caregiver must have tapped IOMW and be in en-route state.
appId: polygentic.bijouxCaregiverApp
---
# Wait for "I've Arrived" button to appear
- extendedWaitUntil:
    visible: "I've Arrived"
    timeout: 30000
- tapOn: "I've Arrived"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-arrived
