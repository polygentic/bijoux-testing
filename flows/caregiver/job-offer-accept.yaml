# jira: BA-603
# uat: UAT-6.3 Job Offer Accept - Verify caregiver can reach ready state
# NOTE: Actual offer acceptance requires real-time offer from backend.
# This test validates the caregiver can reach the ready state.
# Full flow requires API orchestration to push an offer.
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email for online caregiver
- tapOn: "you@example.com"
- inputText: "cg-maria@test.bijoux.app"

# Dismiss keyboard

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Toggle back to secure mode
- tapOn: "Hide password"

# Dismiss keyboard

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard loads
- assertVisible: "Home"

# Maria is already online in the seed data, so verify the online state
# The bottom toggle shows "Online" (not "Go Online") per AvailabilityToggle.swift
- assertVisible: "Online"

# Verify the greeting and waiting status
- assertVisible: ".*Maria.*"

# Take screenshot of online/ready state
- takeScreenshot: job-offer-accept-ready-state
