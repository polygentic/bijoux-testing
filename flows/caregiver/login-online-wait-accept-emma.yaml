# Combined: Emma Login + Go Online + Wait for Offer + Accept + IOMW + Arrival
# Same as login-online-wait-accept.yaml but for cg-emma account.
# Used by multi-parent E2E: Emma accepts Sarah's booking.
appId: polygentic.bijouxCaregiverApp
tags:
  - cross-app
---
# --- Login Phase ---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn: "Get Started"

- waitForAnimationToEnd

- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

- tapOn: "Welcome Back"

# Toggle password to plain text (Maestro XCTest can't input into SecureField on iOS 26.5)
- tapOn: "Show password"

# Wait for SwiftUI to swap SecureField → TextField (may take extra time under load)
- extendedWaitUntil:
    visible:
      id: "login-password-field"
    timeout: 5000

- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

- tapOn: "Hide password"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- tapOn:
    text: "Not Now"
    optional: true

- waitForAnimationToEnd

- assertVisible: "Home"

- takeScreenshot: results/cross-app/caregiver-emma-logged-in

# --- Go Online Phase ---
- tapOn:
    text: ".*Go Online.*|.*Online.*"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: results/cross-app/caregiver-emma-went-online

# --- Wait for Offer + Accept Phase ---
# The parent booking happens concurrently. Wait up to 3 minutes for offer dispatch.
- extendedWaitUntil:
    visible: "Accept"
    timeout: 180000

- takeScreenshot: results/cross-app/caregiver-emma-offer-received

- tapOn: "Accept"

- waitForAnimationToEnd

- takeScreenshot: results/cross-app/caregiver-emma-offer-accepted

# --- IOMW Phase ---
- extendedWaitUntil:
    visible: "I'm On My Way"
    timeout: 15000

- tapOn: "I'm On My Way"

- waitForAnimationToEnd

- takeScreenshot: results/cross-app/caregiver-emma-iomw

# --- Arrival Phase ---
- extendedWaitUntil:
    visible: "I've Arrived"
    timeout: 30000

- tapOn: "I've Arrived"

- waitForAnimationToEnd

- takeScreenshot: results/cross-app/caregiver-emma-arrived
