# jira: BA-301
# uat: UAT-20.3 — One-Party Delayed (Caregiver — submits first)
# Scenario: Both sims NEAR. Caregiver submits proximity first (backend returns 'waiting');
#   the parent flow launches ~35s later. When the parent submits, both resolve to 'passed'
#   and the caregiver's waiting label clears.
# Pre: orchestrator runs sim_set_location NEAR + sim_grant_location.
appId: polygentic.bijouxCaregiverApp
tags:
  - cross-app
  - proximity
---
# ═══ LOGIN ═══
- launchApp:
    clearState: true
    clearKeychain: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow While Using App"
    optional: true
- waitForAnimationToEnd
- tapOn: "Get Started"
- waitForAnimationToEnd
- tapOn: "you@example.com"
- inputText: "cg-maria@test.bijoux.app"
- tapOn: "Welcome Back"
- tapOn: "Show password"
- extendedWaitUntil:
    visible:
      id: "login-password-field"
    timeout: 5000
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"
- tapOn: "Hide password"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- assertVisible: "Home"

# ═══ GO ONLINE ═══
- tapOn:
    text: ".*Go Online.*|.*Online.*"
    optional: true
- waitForAnimationToEnd

# ═══ WAIT FOR OFFER + ACCEPT ═══
- extendedWaitUntil:
    visible: "Accept"
    timeout: 180000
- tapOn: "Accept"
- waitForAnimationToEnd

# ═══ IOMW ═══
- extendedWaitUntil:
    visible: "I'm On My Way"
    timeout: 15000
- tapOn: "I'm On My Way"
- waitForAnimationToEnd

# ═══ ARRIVAL (NEAR → passes) ═══
- extendedWaitUntil:
    visible: "I've Arrived"
    timeout: 30000
# Scroll the below-the-fold "I've Arrived" button above the tab bar before tapping, or
# Maestro taps its off-screen coordinates and mis-navigates to Activity (see happy-path).
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- tapOn: "I've Arrived"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/proximity-cg-delay-arrived

# ═══ VERIFY START — caregiver submits FIRST → waiting ═══
- extendedWaitUntil:
    visible:
      id: "arrived-verify-button"
    timeout: 30000
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: "arrived-verify-button"
- waitForAnimationToEnd
# Caregiver submitted first → backend returns 'waiting'; the label appears.
- extendedWaitUntil:
    visible:
      id: "proximity-waiting-label"
    timeout: 20000
- takeScreenshot: results/cross-app/proximity-cg-polling-waiting
# Parent launches ~35s later (orchestrator). When the parent submits, both resolve to passed.
- extendedWaitUntil:
    notVisible:
      id: "proximity-waiting-label"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "verification-capture-button"
    timeout: 30000
- tapOn:
    id: "verification-capture-button"
- waitForAnimationToEnd

# ═══ SESSION ACTIVE ═══
- extendedWaitUntil:
    visible:
      id: "home-active-job-card"
    timeout: 120000
- tapOn:
    id: "home-active-job-card"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/proximity-cg-delay-session-active

# ═══ END JOB ═══
- extendedWaitUntil:
    visible:
      id: "in-progress-end-button"
    timeout: 30000
- tapOn:
    id: "in-progress-end-button"
- waitForAnimationToEnd
- tapOn: "Confirm"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "verification-capture-button"
    timeout: 30000
- tapOn:
    id: "verification-capture-button"
- waitForAnimationToEnd

# ═══ SESSION COMPLETE ═══
- extendedWaitUntil:
    visible: ".*Session Complete.*|.*Take Home.*|.*Well done.*"
    timeout: 120000
- takeScreenshot: results/cross-app/proximity-cg-delay-session-complete
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: ".*Take Home.*|.*Dismiss.*"
    optional: true
- waitForAnimationToEnd
