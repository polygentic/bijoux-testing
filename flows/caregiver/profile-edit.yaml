# jira: BA-708
# uat: UAT-7.8 Profile Edit - Verify edit form loads with pre-filled data
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

# Dismiss keyboard

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Toggle back to secure mode
- tapOn: "Hide password"

# Dismiss keyboard

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard
- assertVisible: "Home"

# Navigate to Preferences tab (text-based tap for tab bar)
- tapOn: "Profile"

- waitForAnimationToEnd

# Tap Edit Profile
- tapOn: ".*Edit Profile.*|.*Edit.*"

- waitForAnimationToEnd

# Verify edit form loads with pre-filled data (Emma's name)
- assertVisible: "Emma"

# Scroll to find Save Changes button
- assertVisible: "Save Changes"
