# uat: SUB — Caregiver End Session
# NOTE: Sub-flow. Caregiver must have an active session.
appId: polygentic.bijouxCaregiverApp
---
# End the active session
- tapOn: "End Session"
  optional: true
- tapOn: "Complete Session"
  optional: true
- waitForAnimationToEnd
# Confirm end session
- tapOn: "Confirm"
  optional: true
- waitForAnimationToEnd
# Veriff end verification (mocked)
- tapOn: "Verify"
  optional: true
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-session-ended
