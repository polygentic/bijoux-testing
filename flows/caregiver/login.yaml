# jira: BA-XXX
# uat: UAT-2.2 Caregiver Login — Valid Credentials
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Get Started"
- assertVisible: "Welcome back"
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"
- tapOn: "Welcome Back"
- tapOn: "Show password"
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"
- takeScreenshot: results/caregiver-login-filled
- scroll
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
# Login succeeds — caregiver account lands on profile completion
# or home dashboard depending on profile state
- assertVisible: "Complete Your Profile"
- takeScreenshot: results/caregiver-login-success
