# jira: BA-405
# uat: UAT-4.5 Go Online/Offline - Toggle online status
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

# Dismiss keyboard
- scroll

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Dismiss keyboard
- scroll

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard
- assertVisible:
    id: "home-greeting-label"

# Scroll to find the go online button
- scroll

# Tap Go Online to toggle status
- tapOn: ".*Go Online.*"

- waitForAnimationToEnd

# Verify status changed to online
- assertVisible: ".*Online.*|.*Go Offline.*"

# Toggle back to offline
- tapOn: ".*Go Offline.*"

- waitForAnimationToEnd

# Verify status changed back to offline
- assertVisible: ".*Offline.*|.*Go Online.*"
