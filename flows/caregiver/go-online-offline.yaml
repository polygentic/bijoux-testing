# jira: BA-405
# uat: UAT-4.5 Go Online/Offline - Toggle online status
# Uses Maria Santos (no active session) to test the online/offline toggle
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Login as Maria Santos (approved, no active session)
- tapOn: "you@example.com"
- inputText: "cg-maria@test.bijoux.app"

# Dismiss keyboard

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Toggle back to secure mode
- tapOn: "Hide password"

# Dismiss keyboard

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard
- assertVisible: "Home"

- takeScreenshot: caregiver-go-online-before

# Look for the online/offline toggle

# Tap Go Online to toggle status
- tapOn: ".*Go Online.*|.*Online.*|.*Offline.*"

- waitForAnimationToEnd

- takeScreenshot: caregiver-go-online-after
