# jira: BA-710
# uat: UAT-7.10 Emergency Contacts - Verify emergency contact section
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

# Dismiss keyboard
- scroll

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Dismiss keyboard
- scroll

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard
- assertVisible: "Home"

# Navigate to Preferences tab (text-based tap for tab bar)
- tapOn: "Profile"

- waitForAnimationToEnd

# Scroll to find emergency contact section
- scroll

# Verify emergency contact info or add button is visible
- assertVisible: ".*Emergency.*|.*Contact.*|.*Add.*"
