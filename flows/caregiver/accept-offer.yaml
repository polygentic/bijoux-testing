# jira: BA-XXX
# uat: SUB — Caregiver Accept Offer
# NOTE: Sub-flow for cross-app E2E. Caregiver should be logged in, but if the app
#       lost its session (XCTest driver restart), it will re-login automatically.
appId: polygentic.bijouxCaregiverApp
---
- launchApp

- waitForAnimationToEnd

# Re-login if app lost session (XCTest driver restart can clear app state on iOS 26.5)
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
      - waitForAnimationToEnd
      - tapOn: "you@example.com"
      - inputText: "cg-maria@test.bijoux.app"
      - tapOn: "Welcome Back"
      - tapOn: "Show password"
      - tapOn:
          id: "login-password-field"
      - inputText: "Test1234!"
      - tapOn: "Hide password"
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd
      - tapOn:
          text: "Not Now"
          optional: true
      - waitForAnimationToEnd

# Wait for offer to appear on home screen (polling from backend)
- extendedWaitUntil:
    visible: "Accept"
    timeout: 90000
- takeScreenshot: results/cross-app/caregiver-offer-received
# Accept the offer
- tapOn: "Accept"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-offer-accepted
