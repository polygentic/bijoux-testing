# jira: BA-404
# uat: UAT-4.4 Tab Navigation - Navigate through all tabs
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

# Dismiss keyboard

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Toggle back to secure mode
- tapOn: "Hide password"

# Dismiss keyboard

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify Home tab is active (default after login)
- assertVisible: "Home"

# Navigate to Activity tab (text-based tap for tab bar)
- tapOn: "Activity"

- waitForAnimationToEnd

# Verify Activity screen content
- assertVisible: ".*Activity.*|.*History.*"

# Navigate to Earnings tab
- tapOn: "Earnings"

- waitForAnimationToEnd

# Verify Earnings screen content
- assertVisible: ".*Earnings.*|.*Total.*"

# Navigate to Preferences tab
- tapOn: "Profile"

- waitForAnimationToEnd

# Verify Preferences screen content
- assertVisible: ".*Profile.*|.*Settings.*"

# Navigate back to Home tab
- tapOn: "Home"

- waitForAnimationToEnd

# Verify back on Home
- assertVisible: "Home"
