# Combined: Emma Login + Go Online + Wait for Offer + Decline
# Runs as a single continuous flow to prevent XCTest driver restart from losing session.
# Used by decline-then-accept E2E: Emma declines, then Maria accepts.
appId: polygentic.bijouxCaregiverApp
tags:
  - cross-app
---
# --- Login Phase ---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn: "Get Started"

- waitForAnimationToEnd

- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

- tapOn: "Welcome Back"

# Toggle password to plain text (Maestro XCTest can't input into SecureField on iOS 26.5)
- tapOn: "Show password"

# Wait for SwiftUI to swap SecureField → TextField (may take extra time under load)
- extendedWaitUntil:
    visible:
      id: "login-password-field"
    timeout: 5000

- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

- tapOn: "Hide password"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- tapOn:
    text: "Not Now"
    optional: true

- waitForAnimationToEnd

- assertVisible: "Home"

- takeScreenshot: results/cross-app/caregiver-emma-logged-in

# --- Go Online Phase ---
- tapOn:
    text: ".*Go Online.*|.*Online.*"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: results/cross-app/caregiver-emma-went-online

# --- Wait for Offer + Decline Phase ---
# Wait up to 3 minutes for the matching engine to dispatch an offer
- extendedWaitUntil:
    visible: ".*Decline.*|.*No Thanks.*"
    timeout: 180000

- takeScreenshot: results/cross-app/caregiver-emma-offer-received

- tapOn:
    text: ".*Decline.*|.*No Thanks.*"

- waitForAnimationToEnd

# Confirm decline if prompted
- tapOn:
    text: ".*Confirm.*|.*Yes.*|.*Decline.*"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: results/cross-app/caregiver-emma-offer-declined
