# Combined: Login → Online → Accept → IOMW → Arrive → Verify Start → Active Session → End → Complete
# Full caregiver lifecycle in a single Maestro process (prevents XCTest driver restart state loss).
# Runs CONCURRENTLY with parent/login-book-session-end.yaml on the parent simulator.
appId: polygentic.bijouxCaregiverApp
tags:
  - cross-app
  - session-lifecycle
---
# ═══ LOGIN ═══
- launchApp:
    clearState: true
    clearKeychain: true
- waitForAnimationToEnd
- tapOn: "Get Started"
- waitForAnimationToEnd
- tapOn: "you@example.com"
- inputText: "cg-maria@test.bijoux.app"
- tapOn: "Welcome Back"
- tapOn: "Show password"
- extendedWaitUntil:
    visible:
      id: "login-password-field"
    timeout: 5000
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"
- tapOn: "Hide password"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- assertVisible: "Home"
- takeScreenshot: results/cross-app/caregiver-maria-logged-in

# ═══ GO ONLINE ═══
- tapOn:
    text: ".*Go Online.*|.*Online.*"
    optional: true
- waitForAnimationToEnd

# ═══ WAIT FOR OFFER + ACCEPT ═══
- extendedWaitUntil:
    visible: "Accept"
    timeout: 180000
- takeScreenshot: results/cross-app/caregiver-offer-received
- tapOn: "Accept"
- waitForAnimationToEnd

# ═══ IOMW ═══
- extendedWaitUntil:
    visible: "I'm On My Way"
    timeout: 15000
- tapOn: "I'm On My Way"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-iomw

# ═══ ARRIVAL ═══
- extendedWaitUntil:
    visible: "I've Arrived"
    timeout: 30000
- tapOn: "I've Arrived"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-arrived

# ═══ VERIFY START (identity verification — mock Veriff) ═══
- extendedWaitUntil:
    visible:
      id: "arrived-verify-button"
    timeout: 30000
# Scroll up to bring the verify button above the tab bar
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: "arrived-verify-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "verification-capture-button"
    timeout: 30000
- tapOn:
    id: "verification-capture-button"
- waitForAnimationToEnd

# ═══ WAIT FOR SESSION ACTIVE (parent must also verify) ═══
# After verification, the app returns to home dashboard with session card.
# Wait for the active session card, then tap it to enter session detail.
- extendedWaitUntil:
    visible:
      id: "home-active-job-card"
    timeout: 120000
- tapOn:
    id: "home-active-job-card"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-session-active

# ═══ END JOB ═══
# Wait for the End Job button in session detail view
- extendedWaitUntil:
    visible:
      id: "in-progress-end-button"
    timeout: 30000
- tapOn:
    id: "in-progress-end-button"
- waitForAnimationToEnd
# Confirm the "End Job?" alert
- tapOn: "Confirm"
- waitForAnimationToEnd

# ═══ VERIFY END (identity verification — mock Veriff) ═══
- extendedWaitUntil:
    visible:
      id: "verification-capture-button"
    timeout: 30000
- tapOn:
    id: "verification-capture-button"
- waitForAnimationToEnd

# ═══ WAIT FOR SESSION COMPLETE (parent must also verify end) ═══
- extendedWaitUntil:
    visible: ".*Session Complete.*|.*Take Home.*|.*Well done.*"
    timeout: 120000
- takeScreenshot: results/cross-app/caregiver-session-complete

# ═══ DONE ═══
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: ".*Take Home.*|.*Dismiss.*"
    optional: true
- waitForAnimationToEnd
