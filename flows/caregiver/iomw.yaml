# uat: SUB — Caregiver I'm On My Way
# NOTE: Sub-flow. Caregiver must have just accepted an offer.
appId: polygentic.bijouxCaregiverApp
tags:
  - sub-flow
---
- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
