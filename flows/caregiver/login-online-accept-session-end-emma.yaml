# Combined: Login + Online + Accept + IOMW + Arrive + Verify Start + Active Session + End + Complete
# Full caregiver lifecycle in a single Maestro process for Emma (cg-emma@test.bijoux.app).
# Same as login-online-accept-session-end.yaml but with Emma's credentials.
# Used by multi-parent E2E: Emma handles Sarah's booking.
appId: polygentic.bijouxCaregiverApp
tags:
  - cross-app
  - session-lifecycle
---
# ═══ LOGIN ═══
- launchApp:
    clearState: true
    clearKeychain: true
- waitForAnimationToEnd
- tapOn: "Get Started"
- waitForAnimationToEnd
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"
- tapOn: "Welcome Back"
- tapOn: "Show password"
- extendedWaitUntil:
    visible:
      id: "login-password-field"
    timeout: 5000
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"
- tapOn: "Hide password"
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- assertVisible: "Home"
- takeScreenshot: results/cross-app/caregiver-emma-logged-in

# ═══ GO ONLINE ═══
- tapOn:
    text: ".*Go Online.*|.*Online.*"
    optional: true
- waitForAnimationToEnd

# ═══ WAIT FOR OFFER + ACCEPT ═══
- extendedWaitUntil:
    visible: "Accept"
    timeout: 180000
- takeScreenshot: results/cross-app/caregiver-emma-offer-received
- tapOn: "Accept"
- waitForAnimationToEnd

# ═══ IOMW ═══
- extendedWaitUntil:
    visible: "I'm On My Way"
    timeout: 15000
- tapOn: "I'm On My Way"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-emma-iomw

# ═══ ARRIVAL ═══
- extendedWaitUntil:
    visible: "I've Arrived"
    timeout: 30000
- tapOn: "I've Arrived"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-emma-arrived

# ═══ VERIFY START (identity verification) ═══
- extendedWaitUntil:
    visible:
      id: "arrived-verify-button"
    timeout: 30000
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: "arrived-verify-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "verification-capture-button"
    timeout: 30000
- tapOn:
    id: "verification-capture-button"
- waitForAnimationToEnd

# ═══ WAIT FOR SESSION ACTIVE (parent must also verify) ═══
- extendedWaitUntil:
    visible:
      id: "home-active-job-card"
    timeout: 120000
- tapOn:
    id: "home-active-job-card"
- waitForAnimationToEnd
- takeScreenshot: results/cross-app/caregiver-emma-session-active

# ═══ END JOB ═══
- extendedWaitUntil:
    visible:
      id: "in-progress-end-button"
    timeout: 30000
- tapOn:
    id: "in-progress-end-button"
- waitForAnimationToEnd
- tapOn: "Confirm"
- waitForAnimationToEnd

# ═══ VERIFY END (identity verification) ═══
- extendedWaitUntil:
    visible:
      id: "verification-capture-button"
    timeout: 30000
- tapOn:
    id: "verification-capture-button"
- waitForAnimationToEnd

# ═══ WAIT FOR SESSION COMPLETE (parent must also verify end) ═══
- extendedWaitUntil:
    visible: ".*Session Complete.*|.*Take Home.*|.*Well done.*"
    timeout: 120000
- takeScreenshot: results/cross-app/caregiver-emma-session-complete

# ═══ DONE ═══
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: ".*Take Home.*|.*Dismiss.*"
    optional: true
- waitForAnimationToEnd
