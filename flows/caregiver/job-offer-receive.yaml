# jira: BA-602
# uat: UAT-6.2 Job Offer Receive - Verify home screen ready state
# NOTE: Receiving an actual offer requires backend to push one.
# This test validates the home screen is ready to receive offers (idle/waiting state).
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# Enter email for online caregiver
- tapOn: "you@example.com"
- inputText: "cg-maria@test.bijoux.app"

# Dismiss keyboard

# Tap on Welcome Back to ensure focus is off email
- tapOn: "Welcome Back"

# Reveal password field with eye toggle
- tapOn: "Show password"

# Tap password field and enter password
- tapOn:
    id: "login-password-field"
- inputText: "Test1234!"

# Toggle back to secure mode
- tapOn: "Hide password"

# Dismiss keyboard

# Tap login submit button
- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

# Verify home dashboard loads
- assertVisible:
    id: "home-greeting-label"

# Verify home screen is in idle/waiting state (ready to receive offers)
- assertVisible: ".*online.*|.*waiting.*|.*ready.*|.*Go Online.*|.*available.*"

# Take screenshot of ready state
- takeScreenshot: job-offer-receive-ready-state
