# jira: BA-102
# uat: UAT-1.2 Onboarding - Verify splash and Get Started
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Verify splash / onboarding screen shows Get Started
- assertVisible: "Get Started"

# Tap Get Started to proceed to login
- tapOn: "Get Started"

- waitForAnimationToEnd

# Verify we land on the Welcome back login screen
- assertVisible: "Welcome Back"
