# jira: BA-305
# uat: UAT-3.5 Signup - Duplicate email shows error
appId: polygentic.bijouxCaregiverApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

# Tap Get Started on onboarding screen
- tapOn: "Get Started"

- waitForAnimationToEnd

# From login screen, tap signup link
- tapOn: "Sign Up"

- waitForAnimationToEnd

# --- Step 1: Name ---
- tapOn: "Enter your first name"
- inputText: "Test"

- tapOn: "Enter your last name"
- inputText: "Caregiver"

- tapOn: "Continue"

- waitForAnimationToEnd

# --- Step 2: Email (use existing account) ---
- tapOn: "you@example.com"
- inputText: "cg-emma@test.bijoux.app"

- tapOn: "Continue"

- waitForAnimationToEnd

# --- Step 3: Password ---
# Toggle password to plain text mode via eye icon
# (Workaround: Maestro XCTest driver cannot input into SwiftUI SecureField on iOS 26.5)
- tapOn:
    text: "Show password"
    index: 0
- tapOn:
    id: "signup-password-field"
- inputText: "Test1234!"
- tapOn:
    text: "Hide password"
    index: 0

# Toggle confirm password to plain text mode
- tapOn:
    text: "Show password"
    index: 1
- tapOn:
    id: "signup-confirm-password-field"
- inputText: "Test1234!"
- tapOn:
    text: "Hide password"
    index: 0


- tapOn:
    id: "signup-continue-button"

- waitForAnimationToEnd

# Assert duplicate email error is visible
- assertVisible: ".*already.*|.*exists.*|.*duplicate.*|.*registered.*"

- takeScreenshot: caregiver-signup-duplicate-error
