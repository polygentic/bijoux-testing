# Cross-app sub-flow: Parent Login + Create Quick Booking
# Combines login-valid and quick-booking-submit into a single Maestro run
appId: polygentic.bijouxParentApp
tags:
  - cross-app
---
# --- Login Phase ---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- tapOn:
    id: "onboarding-get-started-button"

- waitForAnimationToEnd

- tapOn: "you@example.com"
- inputText: "parent-sarah@test.bijoux.app"

- tapOn: "Welcome Back"

- tapOn: "Enter your password"
- inputText: "Test1234!"

- tapOn: "Welcome Back"

- tapOn:
    id: "login-submit-button"

- waitForAnimationToEnd

- assertVisible:
    id: "home-greeting-label"

- takeScreenshot: results/cross-app/parent-logged-in

# --- Create Quick Booking Phase ---
- tapOn:
    id: "home-request-now-card"
    optional: true

- tapOn:
    text: "Request Now"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: results/cross-app/parent-booking-form

# Dismiss any keyboard/autocomplete overlay
- tapOn:
    text: "Duration"
    optional: true

# Select first child
- tapOn:
    text: ".*Lily.*|.*Max.*"
    optional: true

# Swipe up to reveal submit button (bare scroll crashes XCTest on iOS 26.5)
- swipe:
    direction: UP
    duration: 400

- waitForAnimationToEnd

# Submit booking
- tapOn:
    id: "quick-booking-submit-button"
- waitForAnimationToEnd

# Handle stubbed identity verification (if shown)
- tapOn:
    text: "Capture"
    optional: true
- waitForAnimationToEnd

# If verification sent us back to booking form, submit again
- tapOn:
    id: "quick-booking-submit-button"
    optional: true
- waitForAnimationToEnd

# Should transition to matching/searching state
- takeScreenshot: results/cross-app/parent-matching-started
